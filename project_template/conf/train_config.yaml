defaults:
  - dataset: default
  - model: default
  - optimizer: default
  - train: smoke
  - wandb: disabled
  - optional slurm: null
  - _self_

name: training
seed: 0

output:
  root: artifacts
  name: ${name}

hash:
  profile: model
  n_chars: 12
  extra_exclude: []

hydra:
  run:
    dir: outputs/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
