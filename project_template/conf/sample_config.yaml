defaults:
  - sample: default
  - optional slurm: null
  - _self_

name: default
seed: 0

source:
  run_dir: artifacts/training/example

output:
  name: ${name}

hash:
  profile: sample
  n_chars: 12
  extra_exclude: []

hydra:
  run:
    dir: outputs/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
