[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-template"
version = "0.1.0"
description = "Hydra-based reproducible research project template for training and standalone data pipelines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3",
    "hydra-submitit-launcher>=1.2",
    "numpy>=1.26",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
ml = [
    "jax[cuda12]>=0.4; platform_system == 'Linux'",
    "flax>=0.8",
    "optax>=0.2",
    "wandb>=0.19",
]

[project.scripts]
project-template-train = "project_template.train:main"
project-template-sample = "project_template.sample:main"
project-template-eval = "project_template.eval:main"
project-template-pipeline = "project_template.pipeline:main"

[tool.hatch.build.targets.wheel]
packages = ["project_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["project_template", "tests"]
